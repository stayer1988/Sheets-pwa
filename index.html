<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Листы и рисунки</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1769aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Листы">

<style>
:root{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#202124;background:#f3f5f8}
*{box-sizing:border-box}
body{margin:0}
button,select,input{font:inherit}
button,select,input[type=number],input[type=color]{min-height:38px;border:1px solid #c7ccd3;border-radius:7px;background:#fff;padding:6px 10px;color:inherit}
button{cursor:pointer}
button:hover{background:#eef3fa}
button.primary{background:#1769aa;color:white;border-color:#1769aa}
button.active{background:#dcecff;border-color:#5489bd}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d8dce2;padding:10px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;box-shadow:0 2px 8px #0000000b}
header strong{font-size:17px;margin-right:8px}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.separator{height:28px;border-left:1px solid #d8dce2;margin:0 2px}
#sheets{padding:18px 12px 80px;display:flex;flex-direction:column;align-items:center;gap:24px}
.sheet-card{width:min(100%,1000px);background:#fff;padding:12px;border:1px solid #d9dde3;border-radius:10px;box-shadow:0 3px 14px #17202c12}
.sheet-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sheet-head .sheet-name{font-weight:650;margin-right:auto}
.sheet-head select{max-width:150px}
.sheet-head input[type=number]{width:88px}
.stage{position:relative;width:100%;background:#fff;border:1px solid #aeb4bd;overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hint{font-size:12px;color:#606975;padding:8px 2px 0}
.props{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid #e4e7eb}
.props label,.sheet-head label{display:flex;align-items:center;gap:5px;font-size:13px;color:#505660}
.props input[type=number]{width:90px}
.props input[type=text]{width:180px}
.props input[type=color]{width:46px;padding:3px}
.props .spacer{flex:1}
.muted{font-size:12px;color:#68717c}
.color-control{position:relative}
#drawColorToggle{display:inline-flex;align-items:center;gap:7px}
#drawColorSwatch{width:18px;height:18px;border:1px solid #737983;border-radius:50%;background:#222}
#colorPicker{position:absolute;top:calc(100% + 8px);left:0;z-index:10;width:220px;padding:12px;background:#fff;border:1px solid #c7ccd3;border-radius:10px;box-shadow:0 6px 20px #0002}
#colorPicker[hidden]{display:none}
#colorPicker strong{display:block;margin:0 0 8px;font-size:14px}
#colorWheel{width:184px;height:184px;display:block;margin:0 auto;touch-action:none;cursor:crosshair}
.color-brightness{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.color-brightness input{width:100%;accent-color:#555}
.color-preview{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:13px}
#colorPreviewSwatch{width:22px;height:22px;border:1px solid #aaa;border-radius:50%}
.grid-toggle{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.grid-toggle input,.props .lockAspect{width:18px;height:18px;accent-color:#1769aa}
#fileInput,#projectInput{display:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#moreToolsToggle{display:none}
#moreTools{display:contents}
@media(max-width:650px){
 header{padding:6px 8px;gap:0}
 header strong{display:none}
 .toolbar{display:flex;flex-direction:column;gap:6px;width:100%;padding:0}
 .primary-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
 #moreTools{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%;padding-top:2px}
 header.tools-expanded #moreTools{display:grid}
 #moreToolsToggle{display:block;width:100%;min-height:36px;padding:2px;font-size:18px;line-height:1}
 #moreToolsToggle .arrow{display:inline-block;transition:transform .2s}
 header.tools-expanded #moreToolsToggle .arrow{transform:rotate(180deg)}
 .toolbar>*{min-width:0;width:100%;margin:0}
 .primary-tools>*{min-width:0;width:100%;margin:0}
 #moreTools>*{min-width:0;width:100%;margin:0}
 .toolbar button{padding:4px;white-space:normal;line-height:1.15}
 #moreTools .separator{display:none}
 .grid-toggle{justify-content:center;white-space:normal;text-align:center;line-height:1.1;padding:2px}
 button,select,input[type=number],input[type=color]{min-height:44px;font-size:16px}
 input[type=text]{font-size:16px;min-height:44px}
 .color-control{position:static}
 #colorPicker{position:fixed;left:50%;top:64px;transform:translateX(-50%);width:min(260px,90vw)}
 #colorWheel{width:min(220px,70vw);height:auto;aspect-ratio:1}
 #sheets{padding:8px 6px 40px;gap:14px}
 .sheet-card{padding:8px;border-radius:8px}
 .sheet-head{gap:6px;margin-bottom:8px}
 .sheet-head .sheet-name{width:100%}
 .sheet-head label{flex:1 1 130px;justify-content:space-between}
 .sheet-head select{flex:1;min-width:0}
 .sheet-head button{flex:1 1 auto}
 .hint{display:none}
 .props{position:relative;bottom:auto;z-index:4;background:#fffffff2;gap:7px;margin:8px -8px -8px;padding:8px;border-top:1px solid #cfd4da;border-radius:0 0 8px 8px;overflow:visible;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
 .props>*{min-width:0;width:100%;flex:none}
 .props .spacer{display:none}
 .props label{display:flex;flex-direction:column;align-items:stretch;gap:3px;font-size:12px;min-width:0}
 .props input[type=number]{width:100%;min-width:0}
 .props input[type=text]{width:100%;min-width:0}
 .props input[type=color]{width:100%;max-width:100%;padding:3px}
 .props label:has(.lockAspect){grid-column:1 / -1;flex-direction:row;align-items:center;gap:6px;font-size:13px}
 .props .lockAspect,.grid-toggle input{width:24px;height:24px}
 .props button{white-space:normal;line-height:1.15}
 .props .muted{grid-column:1 / -1}
 @media(max-width:360px){.props{grid-template-columns:minmax(0,1fr)}}
}
@media print{
 @page{margin:0}
 body{background:#fff}
 header,.sheet-head,.props,.hint{display:none!important}
 #sheets{display:block;padding:0}
 .sheet-card{width:auto;padding:0;border:0;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
 .sheet-card:last-child{break-after:auto;page-break-after:auto}
 .stage{width:var(--print-width);height:var(--print-height);border:0;overflow:hidden}
 .stage canvas{width:100%;height:100%}
}
</style>
</head>
<body>
<header>
 <strong>Листы и рисунки</strong>
 <div class="toolbar">
    <div class="primary-tools">
     <button id="addImage">Добавить</button>
     <button id="drawTool">Рисовать</button>
     <button id="print">Печать</button>
     <button id="moreToolsToggle" type="button" aria-expanded="false" aria-controls="moreTools" aria-label="Показать остальные команды"><span class="arrow">▼</span></button>
    </div>
    <div id="moreTools">
     <button id="addSheet" class="primary">＋ Лист</button>
     <button id="addText">Текст</button>
     <div class="color-control"><button id="drawColorToggle" type="button"><span id="drawColorSwatch"></span>Цвет</button><div id="colorPicker" hidden><strong>Цвет рисования</strong><canvas id="colorWheel" width="184" height="184" aria-label="Цветовое колесо"></canvas><label class="color-brightness">Яркость <input id="colorBrightness" type="range" min="0" max="100" value="50"></label><div class="color-preview"><span id="colorPreviewSwatch"></span><span id="colorHex">#800000</span></div></div></div>
     <label class="grid-toggle"><input id="gridSnap" type="checkbox"> Сетка 1 мм</label>
     <button id="matrix">Матрица</button>
     <button id="deleteItem">Удалить</button>
     <span class="separator"></span>
     <button id="saveProject">Сохранить проект</button>
     <button id="loadProject">Открыть проект</button>
    </div>
   </div>
  </header>
<input id="fileInput" type="file" accept="image/*" multiple>
<input id="projectInput" type="file" accept="application/json,.json">
<main id="sheets"></main>
<div id="toast" role="status"></div>
<script>
(() => {
 "use strict";
 const formats = {
  A0:[841,1189],A1:[594,841],A2:[420,594],A3:[297,420],A4:[210,297],A5:[148,210],A6:[105,148],
  B0:[1000,1414],B1:[707,1000],B2:[500,707],B3:[353,500],B4:[250,353],B5:[176,250],
  Letter:[215.9,279.4],Legal:[215.9,355.6],Tabloid:[279.4,431.8],Custom:[210,297]
 };
 const $ = s => document.querySelector(s);
 const sheetsEl = $("#sheets");
 let project = {version:1,sheets:[]}, activeTool = "select", selected = null, activeSheetId = null, cache = new Map(), drawing = null, cropRect = null, snapToGrid = false, activePointers = new Map();
 let drawColor="#800000",colorHue=0,colorSaturation=1,colorLightness=0.5;
 const fmt = n => Math.round(Number(n)*10)/10;
 const toast = message => {
  const el=$("#toast"); el.textContent=message; el.classList.add("show");
  clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove("show"),2400);
 };
 const newId=()=>globalThis.crypto?.randomUUID?crypto.randomUUID():`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
 const makeSheet = (format="A4",width,height) => ({
  id:newId(),format,width:width||formats[format][0],height:height||formats[format][1],orientation:"portrait",items:[]
 });
 project.sheets.push(makeSheet());
 activeSheetId=project.sheets[0].id;
 function dims(sheet){return sheet.orientation==="landscape"?[sheet.height,sheet.width]:[sheet.width,sheet.height]}
 function imageFor(src){
  if(cache.has(src)) return cache.get(src);
  const image=new Image();image.onload=()=>project.sheets.forEach(redraw);image.onerror=()=>toast("Не удалось загрузить изображение из проекта");image.src=src;cache.set(src,image);return image;
 }
 function drawItem(ctx,item){
  const cx=item.x+item.w/2,cy=item.y+item.h/2;
  ctx.save();ctx.translate(cx,cy);ctx.rotate((item.rotation||0)*Math.PI/180);
  if(item.type==="image"){
   const im=imageFor(item.src);
   if(im.complete&&im.naturalWidth){
    const c=item.crop||{x:0,y:0,w:1,h:1};
     ctx.scale(item.flipX?-1:1,item.flipY?-1:1);ctx.filter=item.invertColors?"invert(1)":"none";
     ctx.drawImage(im,c.x*im.naturalWidth,c.y*im.naturalHeight,c.w*im.naturalWidth,c.h*im.naturalHeight,-item.w/2,-item.h/2,item.w,item.h);
    }
   } else if(item.type==="text"){
    const baseW=item.baseW||item.w,baseH=item.baseH||item.h;
    ctx.scale(item.flipX?-1:1,item.flipY?-1:1);
    ctx.scale(item.w/baseW,item.h/baseH);
   ctx.fillStyle=item.color||"#111";ctx.textBaseline="top";ctx.font=`${item.fontSize||12}mm ${item.fontFamily||"sans-serif"}`;
   const lines=(item.text||"Текст").split("\n"),lineHeight=(item.fontSize||12)*1.25;
   lines.forEach((line,i)=>ctx.fillText(line,-baseW/2,-baseH/2+i*lineHeight,baseW));
  } else if(item.type==="draw"){
   if(item.points&&item.points.length){
    ctx.scale(item.flipX?-1:1,item.flipY?-1:1);
    ctx.strokeStyle=item.color||"#111";ctx.lineWidth=item.lineWidth||1.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();
    item.points.forEach((p,i)=>{const x=(p.x-.5)*item.w,y=(p.y-.5)*item.h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    if(item.points.length===1){ctx.lineTo((item.points[0].x-.5)*item.w+.1,(item.points[0].y-.5)*item.h+.1)}
    ctx.stroke();
   }
  }
  ctx.restore();
 }
 function sheetCanvas(sheet,canvas){
  const [w,h]=dims(sheet),rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  const px=Math.max(1,Math.round(rect.width*dpr));
  if(canvas.width!==px||canvas.height!==Math.round(px*h/w)){canvas.width=px;canvas.height=Math.round(px*h/w)}
  const ctx=canvas.getContext("2d");ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);
  ctx.clearRect(0,0,w,h);ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
  sheet.items.forEach(item=>drawItem(ctx,item));
  if(selected&&selected.sheetId===sheet.id){
   const item=sheet.items.find(x=>x.id===selected.itemId);
   if(item){
    const cx=item.x+item.w/2,cy=item.y+item.h/2;ctx.save();ctx.translate(cx,cy);ctx.rotate((item.rotation||0)*Math.PI/180);ctx.scale(item.flipX?-1:1,item.flipY?-1:1);
    ctx.strokeStyle="#1684d4";ctx.lineWidth=Math.max(.4,w/700);ctx.setLineDash([2,1.4]);ctx.strokeRect(-item.w/2,-item.h/2,item.w,item.h);ctx.setLineDash([]);
    const r=handleRadius(sheet,canvas)*.8;ctx.fillStyle="#fff";ctx.strokeStyle="#1684d4";
    [[-item.w/2,-item.h/2],[item.w/2,-item.h/2],[item.w/2,item.h/2],[-item.w/2,item.h/2]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke()});
    ctx.beginPath();ctx.moveTo(0,-item.h/2);ctx.lineTo(0,-item.h/2-r*3);ctx.stroke();
    ctx.beginPath();ctx.arc(0,-item.h/2-r*3,r*1.15,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.restore();
   }
  }
  if(cropRect&&cropRect.sheetId===sheet.id){
   const cropItem=sheet.items.find(x=>x.id===cropRect.itemId);
   if(cropItem){
    // cropRect coordinates are in the image's local coordinate system.
    // Apply the same transform as drawItem so the visible frame follows rotated/flipped images.
    const x1=Math.min(cropRect.start.x,cropRect.end.x),y1=Math.min(cropRect.start.y,cropRect.end.y);
    const x2=Math.max(cropRect.start.x,cropRect.end.x),y2=Math.max(cropRect.start.y,cropRect.end.y);
    const cx=cropItem.x+cropItem.w/2,cy=cropItem.y+cropItem.h/2;
    ctx.save();ctx.translate(cx,cy);ctx.rotate((cropItem.rotation||0)*Math.PI/180);
    ctx.scale(cropItem.flipX?-1:1,cropItem.flipY?-1:1);
    const ax=x1-cropItem.w/2,ay=y1-cropItem.h/2,bx=x2-cropItem.w/2,by=y2-cropItem.h/2;
    ctx.fillStyle="#1684d426";ctx.fillRect(ax,ay,bx-ax,by-ay);
    ctx.strokeStyle="#ffffff";ctx.lineWidth=Math.max(1.2,w/450);ctx.setLineDash([3,2]);ctx.strokeRect(ax,ay,bx-ax,by-ay);
    ctx.setLineDash([]);ctx.strokeStyle="#087ac2";ctx.lineWidth=Math.max(.8,w/650);ctx.strokeRect(ax,ay,bx-ax,by-ay);
    const rr=Math.max(2.2,w/180);
    [[ax,ay],[bx,ay],[bx,by],[ax,by]].forEach(([hx,hy])=>{ctx.beginPath();ctx.arc(hx,hy,rr,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#087ac2";ctx.lineWidth=Math.max(.7,w/900);ctx.stroke()});
    ctx.restore();
   }
  }
 }
 function redraw(sheet){
  const card=document.querySelector(`[data-sheet="${sheet.id}"]`),canvas=card&&card.querySelector("canvas");
  if(canvas)sheetCanvas(sheet,canvas);
 }
 function render(){
  const scrollX=window.scrollX,scrollY=window.scrollY;
  sheetsEl.replaceChildren();
  project.sheets.forEach((sheet,index)=>{
   const card=document.createElement("section");card.className="sheet-card";card.dataset.sheet=sheet.id;
   card.innerHTML=`<div class="sheet-head"><span class="sheet-name">Лист ${index+1}</span><label>Формат <select class="format"></select></label><label>Ориентация <select class="orientation"><option value="portrait">Книжная</option><option value="landscape">Альбомная</option></select></label><label class="custom-size">мм <input class="cw" type="number" min="10" max="2000" step="1"> × <input class="ch" type="number" min="10" max="2000" step="1"></label><button class="duplicate-sheet" title="Дублировать лист">Дублировать</button><button class="remove-sheet" title="Удалить лист">×</button></div><div class="stage"><canvas></canvas></div><div class="hint">Выберите объект для перемещения. Угловые маркеры меняют размер, круг сверху — поворачивает. На телефоне масштабирование и поворот можно делать двумя пальцами.</div><div class="props"></div>`;
   const format=card.querySelector(".format");
   Object.keys(formats).forEach(f=>{const op=document.createElement("option");op.value=f;op.textContent=f==="Custom"?"Свой размер":f;format.append(op)});
   format.value=sheet.format;card.querySelector(".orientation").value=sheet.orientation;
   card.querySelector(".cw").value=sheet.width;card.querySelector(".ch").value=sheet.height;
   card.querySelector(".custom-size").style.display=sheet.format==="Custom"?"flex":"none";
   format.onchange=()=>{sheet.format=format.value;sheet.width=formats[sheet.format][0];sheet.height=formats[sheet.format][1];render()};
   card.querySelector(".orientation").onchange=e=>{sheet.orientation=e.target.value;render()};
   const changeCustom=()=>{sheet.format="Custom";sheet.width=Math.max(10,+card.querySelector(".cw").value||210);sheet.height=Math.max(10,+card.querySelector(".ch").value||297);format.value="Custom";render()};
   card.querySelector(".cw").onchange=changeCustom;card.querySelector(".ch").onchange=changeCustom;
   card.querySelector(".remove-sheet").onclick=()=>{if(project.sheets.length===1){toast("В проекте должен остаться хотя бы один лист");return}project.sheets.splice(index,1);if(selected?.sheetId===sheet.id)selected=null;if(activeSheetId===sheet.id)activeSheetId=project.sheets[Math.max(0,index-1)].id;render()};
   card.querySelector(".duplicate-sheet").onclick=()=>{const copy=JSON.parse(JSON.stringify(sheet));copy.id=newId();copy.items.forEach(x=>x.id=newId());project.sheets.splice(index+1,0,copy);activeSheetId=copy.id;render()};
   card.querySelector("canvas").addEventListener("touchstart",e=>{if((e.touches.length>=2&&drawing?.kind==="move")||(e.touches.length===1&&touchWouldCapture(e,sheet,card.querySelector("canvas"))))e.preventDefault()},{passive:false});
   card.querySelector("canvas").addEventListener("pointerdown",e=>pointerDown(e,sheet,card.querySelector("canvas")));
   card.querySelector("canvas").addEventListener("pointermove",e=>pointerMove(e,sheet,card.querySelector("canvas")));
   card.querySelector("canvas").addEventListener("pointerup",e=>pointerUp(e,sheet,card.querySelector("canvas")));
   card.querySelector("canvas").addEventListener("pointercancel",e=>{activePointers.delete(e.pointerId);drawing=null;cropRect=null;redraw(sheet)});
   card.querySelector(".props").replaceChildren();
   sheetsEl.append(card);renderProps(sheet,card.querySelector(".props"));sheetCanvas(sheet,card.querySelector("canvas"));
  });
  requestAnimationFrame(()=>window.scrollTo(scrollX,scrollY));
 }
 function renderProps(sheet,el){
  const item=selected?.sheetId===sheet.id?sheet.items.find(x=>x.id===selected.itemId):null;
  if(!item){el.innerHTML='<span class="muted">Выберите рисунок или надпись, чтобы задать точные размеры и параметры.</span>';return}
  el.innerHTML=`<label>Ширина, мм <input class="pw" type="number" min="1" step="0.1" value="${fmt(item.w)}"></label><label>Высота, мм <input class="ph" type="number" min="1" step="0.1" value="${fmt(item.h)}"></label><label>Поворот, ° <input class="prot" type="number" step="1" value="${fmt(item.rotation||0)}"></label><label><input class="lockAspect" type="checkbox" ${item.lockAspect!==false?"checked":""}> Сохранять пропорции</label><label>Цвет <input class="pcolor" type="color" value="${item.color||"#222222"}"></label><span class="spacer"></span>`;
  if(item.type==="text")el.innerHTML+=`<label>Текст <input class="ptext" type="text" value="${escapeAttr(item.text||"")}"></label><label>Размер шрифта, мм <input class="pfont" type="number" min="1" step="0.5" value="${item.fontSize||12}"></label>`;
  el.innerHTML+=`<button class="flipX ${item.flipX?"active":""}" type="button" aria-pressed="${!!item.flipX}">Отразить ↔</button><button class="flipY ${item.flipY?"active":""}" type="button" aria-pressed="${!!item.flipY}">Отразить ↕</button>`;
  if(item.type==="image")el.innerHTML+='<button class="invertColors" type="button" aria-pressed="'+!!item.invertColors+'">'+(item.invertColors?"Вернуть цвета":"Инвертировать цвета")+'</button><button class="cropBtn">Обрезать</button>';
  const updateSize=changed=>{
   const ratio=item.w/item.h,lock=el.querySelector(".lockAspect").checked;
   let width=Math.max(1,+el.querySelector(".pw").value||item.w),height=Math.max(1,+el.querySelector(".ph").value||item.h);
   if(changed==="width"&&lock)height=width/ratio;
   if(changed==="height"&&lock)width=height*ratio;
   item.w=snap(width);item.h=snap(height);
   el.querySelector(".pw").value=fmt(item.w);el.querySelector(".ph").value=fmt(item.h);redraw(sheet);
  };
  el.querySelector(".pw").onchange=()=>updateSize("width");
  el.querySelector(".ph").onchange=()=>updateSize("height");
  el.querySelector(".prot").onchange=()=>{item.rotation=+el.querySelector(".prot").value||0;redraw(sheet)};
  el.querySelector(".lockAspect").onchange=e=>{item.lockAspect=e.target.checked};
  el.querySelector(".flipX").onclick=e=>{item.flipX=!item.flipX;e.currentTarget.classList.toggle("active",item.flipX);e.currentTarget.setAttribute("aria-pressed",String(item.flipX));redraw(sheet)};
  el.querySelector(".flipY").onclick=e=>{item.flipY=!item.flipY;e.currentTarget.classList.toggle("active",item.flipY);e.currentTarget.setAttribute("aria-pressed",String(item.flipY));redraw(sheet)};

  reader.onload=()=>{try{const value=JSON.parse(reader.result);if(value.version!==1||!Array.isArray(value.sheets)||!value.sheets.length)throw new Error("Неподдерживаемый формат проекта");project=value;selected=null;activeSheetId=project.sheets[0].id;cache.clear();render();toast("Проект открыт")}catch(err){toast(err.message||"Некорректный файл проекта")}};
  reader.readAsText(file);e.target.value="";
 };
 $("#print").onclick=()=>{
  document.querySelectorAll(".sheet-card").forEach((card,i)=>{const sheet=project.sheets[i],[w,h]=dims(sheet);card.style.setProperty("--print-width",`${w}mm`);card.style.setProperty("--print-height",`${h}mm`)});
  window.print();
 };
 $("#moreToolsToggle").onclick=()=>{
  const expanded=document.querySelector("header").classList.toggle("tools-expanded");
  $("#moreToolsToggle").setAttribute("aria-expanded",String(expanded));
  $("#moreToolsToggle").setAttribute("aria-label",expanded?"Скрыть остальные команды":"Показать остальные команды");
 };
 let printSelection=null;
 window.addEventListener("beforeprint",()=>{printSelection=selected;selected=null;project.sheets.forEach(redraw)});
 window.addEventListener("afterprint",()=>{selected=printSelection;printSelection=null;render()});
 window.addEventListener("resize",()=>project.sheets.forEach(redraw));
 window.addEventListener("keydown",e=>{if(e.key==="Delete"&&selected)$("#deleteItem").click();if(e.key==="Escape"){cropRect=null;drawing=null;setTool("select");project.sheets.forEach(redraw)}});
 render();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("Не удалось зарегистрировать service worker:", err);
    });
  });
}
</script>
